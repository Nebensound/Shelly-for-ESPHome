[workspace]
resolver = "3"
members = ["crates/shelly2esphome", "crates/xtask"]
# `cargo build` and `cargo run` mean the CLI; the repository tasks are
# `cargo xtask` (.cargo/config.toml).
default-members = ["crates/shelly2esphome"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/Nebensound/Shelly-for-ESPHome"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
hex = "0.4"
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-std", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
