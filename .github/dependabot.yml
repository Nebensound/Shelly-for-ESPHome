# Keeps the pinned Mongoose OS libraries and modules of the migration firmware
# (git submodules in migration_firmware/deps/) up to date. Every update is a
# pull request whose CI builds all migration packages; behaviour changes still
# need a test on real hardware before merging.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      mongoose-os:
        patterns:
          - "*"
