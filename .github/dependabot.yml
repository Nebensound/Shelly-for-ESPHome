# Keeps the pinned Mongoose OS libraries and modules of the migration firmware
# (git submodules in migration_firmware/deps/) up to date. Every update is a
# pull request whose CI builds all migration packages with the binaries that
# belong to the new commits (scripts/fetch-prebuilt.sh); main keeps the last
# working pins until such a pull request is green and merged. Behaviour
# changes still need a test on real hardware before merging.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      include: scope
    groups:
      mongoose-os:
        patterns:
          - "*"
