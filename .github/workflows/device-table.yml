name: Device table

# The README's device table is built from docs/device-reports/ (cargo xtask
# device-table). Report pull requests merge with the workflow token, which
# starts no workflow, so this runs once a day (and by hand) instead of on
# push. A changed table goes into one pull request, "docs: update the device
# table", that collects every new report until it is merged. CI gives it a
# new version, so its merge is released; the report pull requests themselves
# keep their version (see the version job in ci.yml).
# Two jobs: cargo runs third-party build code, so it runs in a job that can
# only read; the job that writes never runs cargo and takes over nothing but
# the table.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: device-table
  cancel-in-progress: false

env:
  BRANCH: chore/device-table
  TITLE: "docs: update the device table"

jobs:
  build:
    name: Build the table
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The task builds the CLI's library, which needs no release packages.
      SHELLY2ESPHOME_NO_DOWNLOAD: "1"
    outputs:
      changed: ${{ steps.table.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Build the table
        id: table
        run: |
          set -euo pipefail
          cargo xtask device-table
          mkdir -p "$RUNNER_TEMP/table"
          cp README.md "$RUNNER_TEMP/table/README.md"
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.table.outputs.changed == 'true'
        with:
          name: table
          path: ${{ runner.temp }}/table/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Open or update the pull request
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the branch
      pull-requests: write # open the pull request
      actions: write # dispatch CI on the branch
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: table
          path: ${{ runner.temp }}/table
      # The README comes from a job that ran third-party code: it is taken
      # over only if nothing outside the markers changed and every line
      # between them is a row of the table.
      - name: Take over the table
        run: |
          set -euo pipefail
          table="$RUNNER_TEMP/table/README.md"
          outside() { sed '/<!-- device-table:start -->/,/<!-- device-table:end -->/d' "$1"; }
          if ! diff <(outside README.md) <(outside "$table") > /dev/null; then
            echo "::error::the build changed README.md outside the device table"
            exit 1
          fi
          inside="$(sed -n '/<!-- device-table:start -->/,/<!-- device-table:end -->/p' "$table" | sed '1d;$d')"
          # shellcheck disable=SC2016 # the backticks are Markdown
          row='^\| [A-Za-z0-9]+ \((`[A-Z0-9-]+`|Gen[0-9])\) \| [A-Za-z0-9., -]+ \|$'
          other="$(grep -vE -e "$row" -e '^\| Model \| Stock firmware \|$' -e '^\|---\|---\|$' \
            -e '^No device reports yet\.$' <<< "$inside" || true)"
          if [ -n "$other" ]; then
            echo "::error::unexpected lines in the device table"
            exit 1
          fi
          cp "$RUNNER_TEMP/table/README.md" README.md
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit --quiet --all --message "$TITLE"
          # An unchanged table keeps the branch, its version commit, its CI
          # run and its review.
          if git fetch --quiet origin "refs/heads/$BRANCH" 2>/dev/null \
             && git diff --quiet FETCH_HEAD HEAD -- README.md; then
            echo "the branch already carries this table"
            exit 0
          fi
          git push --force origin "HEAD:refs/heads/$BRANCH"
          pr="$(gh pr list --head "$BRANCH" --base main --state open \
            --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')"
          if [ -z "$pr" ]; then
            {
              echo "Updates the device table in the README from \`docs/device-reports/\`."
              echo
              echo "Built once a day by the device table workflow; it collects every new report"
              echo "until it is merged. Its merge gets a new version and is released."
            } > "$RUNNER_TEMP/pr.md"
            gh pr create --head "$BRANCH" --base main --title "$TITLE" --body-file "$RUNNER_TEMP/pr.md"
          fi
          # Pushes with the workflow token start no workflow. With the title,
          # the version job commits the new version to the branch.
          gh workflow run ci.yml --ref "$BRANCH" -f title="$TITLE"
