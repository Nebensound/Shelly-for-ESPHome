name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by the version job after it pushed a version commit (pushes made
  # with the workflow token never trigger workflows), and by pr-title.yml with
  # the new title when a pull request title changes.
  workflow_dispatch:
    inputs:
      title:
        description: Pull request title to derive the version from
        type: string
        required: false

permissions:
  contents: read

env:
  # Tests must not depend on a release download (crates/shelly2esphome/build.rs);
  # the crate job embeds the packages of this run through the crate's packages/.
  SHELLY2ESPHOME_NO_DOWNLOAD: "1"

# A newer run for the same branch supersedes a running one; the run dispatched
# after a version commit cancels the run that pushed it. Every run on main
# releases, so each main commit gets its own group and is never cancelled.
# A run dispatched for a new title (pr-title.yml) runs on the same commit: if
# it cancelled the running one, that run's failed "CI passed" would stay on
# the commit and block the merge, so it waits for it instead.
concurrency:
  group: >-
    ci-${{ github.ref == 'refs/heads/main' && github.sha
    || format('{0}:{1}', github.event.pull_request.head.repo.full_name || github.repository,
    github.head_ref || github.ref_name) }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main'
    && !(github.event_name == 'workflow_dispatch' && inputs.title != '') }}

jobs:
  # The crate version is derived from the Conventional Commits since the last
  # release tag: `feat` raises the minor, `!`/BREAKING CHANGE the major, anything
  # else the patch version; the pull request title counts too, because a squash
  # merge uses it as commit message. Off main, a version on main that has no
  # release yet counts as taken. On a pull request from this repository (or a
  # dispatch with a title) the job commits the version to the branch; everywhere
  # else crates/shelly2esphome/Cargo.toml must already carry it. A version
  # raised by hand is kept if it is higher.
  # Device reports (docs/device-reports/) are data, not a change of the tool:
  # a pull request that only adds reports keeps its version, and such a commit
  # on main is not released again. The device table in the README that is
  # built from them is a normal change with a new version.
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      version: ${{ steps.effective.outputs.version }}
      # false for a commit on main that only adds device reports.
      release: ${{ steps.effective.outputs.release }}
    steps:
      # On pull requests this is the merge with main, so the latest release tag
      # is reachable even if the branch is older than it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Derive the version from the commits
        id: semantic
        uses: PaulHatch/semantic-version@5ae1354e589c5a67345fb2c6e65b025ff676d7c7 # v6.0.7
        with:
          tag_prefix: "v"
          major_pattern: "/^\\w+(\\([^)]*\\))?!:|^BREAKING[ -]CHANGE:/"
          major_regexp_flags: "m"
          minor_pattern: "/^feat(\\([^)]*\\))?:/"
          minor_regexp_flags: "m"
          search_commit_body: true
          version_format: "${major}.${minor}.${patch}"
      - name: Resolve the effective version
        id: effective
        env:
          VERSION_TYPE: ${{ steps.semantic.outputs.version_type }}
          PREVIOUS: ${{ steps.semantic.outputs.previous_version }}
          TITLE: ${{ github.event.pull_request.title || inputs.title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          highest() { printf '%s\n' "$@" | sort -V | tail -n 1; }
          version_of() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1; }
          raise() {
            IFS=. read -r major minor patch <<< "$1"
            case "$2" in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "$major.$((minor + 1)).0" ;;
              *) echo "$major.$minor.$((patch + 1))" ;;
            esac
          }
          # Whether the change between the given revisions touches nothing but
          # device reports. Without rename detection a file moved into the
          # directory counts with its old path too.
          reports_only() {
            local files
            files="$(git diff --name-only --no-renames "$@")"
            [ -n "$files" ] && [ -z "$(grep -v '^docs/device-reports/' <<< "$files" || true)" ]
          }
          manifest="$(version_of < crates/shelly2esphome/Cargo.toml)"
          title_bump="patch"
          if [[ $TITLE =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
            title_bump="major"
          elif [[ $TITLE =~ ^feat(\([^\)]*\))?: ]]; then
            title_bump="minor"
          fi
          on_main=""
          main_releases=false
          own_bump="patch"
          if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            # A re-run of a release that was already tagged keeps its version.
            if [ "$(git tag --points-at HEAD --list "v$manifest")" = "v$manifest" ]; then
              echo "v$manifest is tagged on this commit already"
              echo "version=$manifest" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Squash merges give every commit on main one parent.
            if reports_only HEAD^ HEAD; then
              echo "only device reports changed; v$manifest is not released again"
              echo "version=$manifest" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            on_main="$(git show "origin/$DEFAULT_BRANCH:crates/shelly2esphome/Cargo.toml" | version_of)"
            # Once main releases by itself, the version it carries is taken.
            if git show "origin/$DEFAULT_BRANCH:.github/workflows/ci.yml" | grep -qx '  version:'; then
              main_releases=true
            fi
            # The version on main already covers every commit on main, even
            # one whose release is not tagged yet; only the commits of this
            # branch may raise it further.
            messages="$(git log --format=%B "origin/$DEFAULT_BRANCH..HEAD")"
            if grep -qE '^[A-Za-z0-9_]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<< "$messages"; then
              own_bump="major"
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$messages"; then
              own_bump="minor"
            fi
            # Three dots: the changes of the branch since it left main. Such
            # a branch keeps the version it carries and gets no version
            # commit; a squash merge keeps the one on main anyway. On main the
            # commit still counts for the next version, so it must not raise
            # more than the patch version a later change raises anyway.
            if reports_only "origin/$DEFAULT_BRANCH...HEAD"; then
              if [ "$own_bump" != patch ] || [ "$title_bump" != patch ]; then
                echo "::error::A pull request that only adds device reports is a patch-level change: use a title and commits like 'docs: …', not 'feat' or a breaking change."
                exit 1
              fi
              echo "only device reports changed; the version stays $manifest"
              echo "version=$manifest" >> "$GITHUB_OUTPUT"
              echo "reports_only=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Before the first release the whole history would count, including
          # breaking changes from long before any release; the first release
          # takes the version from Cargo.toml, and later changes raise the
          # version on main by their title.
          if [ -z "$(git tag --list 'v*')" ]; then
            version="$manifest"
            if [ "$main_releases" = true ]; then
              version="$(highest "$(raise "$on_main" "$title_bump")" "$manifest")"
            fi
            echo "no release yet, main $on_main, Cargo.toml $manifest, effective $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bump="$VERSION_TYPE"
          if [ "$main_releases" = true ]; then
            bump="$own_bump"
          fi
          if [ "$title_bump" = major ] || { [ "$title_bump" = minor ] && [ "$bump" != major ]; }; then
            bump="$title_bump"
          fi
          base="$PREVIOUS"
          if [ "$main_releases" = true ]; then
            base="$(highest "$base" "$on_main")"
          fi
          version="$(highest "$(raise "$base" "$bump")" "$manifest")"
          echo "release $PREVIOUS, base $base, bump $bump (commits since the release $VERSION_TYPE, own $own_bump, title $title_bump), Cargo.toml $manifest, effective $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Decide whether the job may commit the version
        id: mode
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          DISPATCH_TITLE: ${{ inputs.title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$SAME_REPO" = true ]; then
            echo "branch=$GITHUB_HEAD_REF" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$DISPATCH_TITLE" ] && \
               [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the version to the pull request branch
        # A branch with only device reports keeps its version (see above).
        if: steps.mode.outputs.branch != '' && steps.effective.outputs.reports_only != 'true'
        env:
          VERSION: ${{ steps.effective.outputs.version }}
          BRANCH: ${{ steps.mode.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$BRANCH"
          git switch --detach FETCH_HEAD
          sed -i "s/^version = \".*\"\$/version = \"$VERSION\"/" crates/shelly2esphome/Cargo.toml
          sed -i "/^name = \"shelly2esphome\"\$/{n;s/^version = \".*\"\$/version = \"$VERSION\"/;}" Cargo.lock
          if git diff --quiet; then
            echo "The branch already carries version $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: set crate version to $VERSION"
          git push origin "HEAD:refs/heads/$BRANCH"
          gh workflow run ci.yml --ref "$BRANCH"
      # Pushes to main, pull requests from forks and manual runs cannot get a
      # version commit, so a mismatch fails loudly instead.
      - name: Check that Cargo.toml carries the version
        if: steps.mode.outputs.branch == ''
        env:
          VERSION: ${{ steps.effective.outputs.version }}
        run: |
          set -euo pipefail
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/shelly2esphome/Cargo.toml | head -n 1)"
          locked="$(sed -n '/^name = "shelly2esphome"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)"
          if [ "$manifest" != "$VERSION" ] || [ "$locked" != "$VERSION" ]; then
            echo "::error::crates/shelly2esphome/Cargo.toml ($manifest) and Cargo.lock ($locked) must carry version $VERSION. Set it on the pull request branch (a pull request from this repository gets it automatically) and bring the branch up to date with main."
            exit 1
          fi

  migration-firmware-host-tests:
    name: Migration firmware – host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # From PyPI with pinned versions instead of apt: the same versions as a
      # local run, and no dependency on the Ubuntu mirrors.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: migration_firmware/requirements.txt
      - name: Install the pinned Python tools
        run: pip install -r migration_firmware/requirements.txt
      - name: Formatting
        run: clang-format --dry-run --Werror migration_firmware/src/*.c migration_firmware/src/*.h migration_firmware/test/*.c
      - name: Tests with ASan/UBSan
        run: make -C migration_firmware/test check
      - name: Coverage (100% lines, branches, functions)
        run: make -C migration_firmware/test coverage

  migration-firmware:
    name: Migration firmware – ${{ matrix.model }}
    needs: migration-firmware-host-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model:
          - Shelly1
          - Shelly1PM
          - Shelly1L
          - Shelly2
          - Shelly25
          - ShellyPlugS
          - ShellyPlugUS
          - ShellyRGBW2
          - ShellyDimmer1
          - ShellyDimmer2
          - ShellyEM
          - ShellyBulb
          - ShellyVintage
          - ShellyDuo
          - ShellyDuoRGBW
          - ShellyI3
          - ShellyUni
    steps:
      - uses: actions/checkout@v7
      # Everything that goes into the firmware is pinned to the Mongoose OS
      # release 2.20.0 by migration_firmware/mos.yml: libraries and modules
      # from their fixed 2.20.0 tags, the prebuilt libraries from the 2.20.0
      # release assets, the toolchain image of 2.20.0. The mos tool itself is
      # whatever mongoose-os.com serves for 2.20.0 (currently the last build,
      # 2.20.0-20); its version is only logged. Clones authenticate with the
      # workflow token, because GitHub may refuse anonymous clones.
      - name: Install mos
        env:
          MOS_VERSION: 2.20.0
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mos" \
            "https://mongoose-os.com/downloads/mos-$MOS_VERSION/linux/mos"
          chmod +x "$RUNNER_TEMP/mos"
          "$RUNNER_TEMP/mos" version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build with mos (local, Docker)
        working-directory: migration_firmware
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The token is passed as a file so it never shows up in the command line.
          umask 077
          printf 'github.com:%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/mos-credentials"
          mos build --local --platform esp8266 --build-var MODEL=${{ matrix.model }} \
            --credentials "@$RUNNER_TEMP/mos-credentials"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: migration_firmware/requirements.txt
      - name: Install the pinned Python tools (PyYAML)
        run: pip install -r migration_firmware/requirements.txt
      - name: Verify package manifest
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, zipfile
          import yaml

          model = os.environ["MODEL"]
          conds = yaml.safe_load(open("migration_firmware/mos.yml"))["conds"]
          expected = next(
              c["apply"]["name"] for c in conds
              if c["when"] == f'build_vars.MODEL == "{model}"' and "name" in c["apply"]
          )
          with zipfile.ZipFile("migration_firmware/build/fw.zip") as package:
              name = next(n for n in package.namelist() if n.endswith("manifest.json"))
              manifest = json.loads(package.read(name))
          print(f"manifest name={manifest['name']} platform={manifest['platform']} expected={expected}")
          if manifest["name"] != expected or manifest["platform"] != "esp8266":
              sys.exit("manifest does not match the model")
          EOF
      - name: Rename package
        # The build container may leave fw.zip owned by root; copy instead of move.
        run: cp migration_firmware/build/fw.zip "mg2esphome-${{ matrix.model }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mg2esphome-${{ matrix.model }}
          path: mg2esphome-${{ matrix.model }}.zip
          if-no-files-found: error

  cli:
    name: CLI – checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Release build and smoke test outside the source tree
        run: |
          cargo build --release --locked
          cp target/release/shelly2esphome "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          ./shelly2esphome --version
          ./shelly2esphome --help

  cli-msrv:
    name: CLI – MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The MSRV comes from rust-version in Cargo.toml, so it is declared once and
      # Dependabot only ever updates the action, never the toolchain.
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --workspace --all-targets --locked

  cli-coverage:
    name: CLI – coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage gate (100% regions, lines, functions of production code)
        # Unit tests live in src/unit_tests/ and are not production code; modules in
        # subdirectories include them as ../unit_tests/, hence no src/ in the pattern.
        run: >-
          cargo llvm-cov --workspace --all-features --locked --show-missing-lines
          --ignore-filename-regex '/unit_tests/'
          --fail-under-regions 100 --fail-under-lines 100 --fail-under-functions 100

  crate:
    name: CLI – crate with embedded packages
    needs: [cli, migration-firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # The published crate carries the migration packages of all models in
      # packages/ (crates/shelly2esphome/build.rs), so `cargo install
      # shelly2esphome` embeds them without any download.
      - uses: actions/download-artifact@v8
        with:
          pattern: mg2esphome-*
          path: crates/shelly2esphome/packages
          merge-multiple: true
      - name: Check that every model has a package
        run: |
          expected=$(grep -c '^  *(Model::' crates/shelly2esphome/src/model.rs)
          found=$(find crates/shelly2esphome/packages -name 'mg2esphome-*.zip' | wc -l)
          echo "packages: $found of $expected"
          test "$found" -eq "$expected"
      - name: Check that the crate's firmware license is the firmware's license
        run: cmp crates/shelly2esphome/LICENSE-migration-firmware migration_firmware/LICENSE
      # packages/ is ignored by git, but cargo still counts it as uncommitted.
      # --allow-dirty is safe only while every tracked file matches the commit.
      # `cargo package` builds the packaged sources (with the packages) and
      # leaves the .crate and its unpacked sources in target/package/; the dry
      # run adds the registry checks without building again.
      - name: Package and verify the crate
        run: |
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
          cargo publish --dry-run --no-verify --locked --allow-dirty -p shelly2esphome
          cargo package --locked --allow-dirty -p shelly2esphome
      - name: Check the crate size (crates.io accepts 10 MiB)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/shelly2esphome/Cargo.toml | head -n 1)
          crate="target/package/shelly2esphome-$version.crate"
          size=$(stat -c %s "$crate")
          echo "$crate: $size bytes"
          test "$size" -le 10485760
      # Installs from the packaged sources, outside the source tree and with
      # downloads switched off (SHELLY2ESPHOME_NO_DOWNLOAD), then probes a
      # simulated stock device of every model.
      - name: Install the packaged crate and probe every model
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/shelly2esphome/Cargo.toml | head -n 1)
          cargo install --locked --root "$RUNNER_TEMP/install" \
            --path "target/package/shelly2esphome-$version"
          cd "$RUNNER_TEMP"
          python3 "$GITHUB_WORKSPACE/scripts/check-embedded-packages.py" \
            "$GITHUB_WORKSPACE/crates/shelly2esphome/src/model.rs" \
            "$RUNNER_TEMP/install/bin/shelly2esphome"

  cli-binaries:
    name: CLI binary – ${{ matrix.platform }}
    needs: [cli, migration-firmware]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x86_64 }
          - { os: ubuntu-22.04-arm, platform: linux-aarch64 }
          - { os: macos-15-intel, platform: macos-x86_64 }
          - { os: macos-15, platform: macos-aarch64 }
          - { os: windows-2025, platform: windows-x86_64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/download-artifact@v8
        with:
          pattern: mg2esphome-*
          path: crates/shelly2esphome/packages
          merge-multiple: true
      - name: Build, package and test the binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          cargo build --release --locked -p shelly2esphome
          binary="shelly2esphome$EXE"
          archive="shelly2esphome-$PLATFORM"
          mkdir -p dist/stage dist/check
          cp "target/release/$binary" crates/shelly2esphome/{LICENSE,LICENSE-migration-firmware,NOTICE} dist/stage/
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist/stage && "$PYTHON" -m zipfile -c "../$archive.zip" "$binary" LICENSE LICENSE-migration-firmware NOTICE)
            "$PYTHON" -m zipfile -e "dist/$archive.zip" dist/check
          else
            tar -czf "dist/$archive.tar.gz" -C dist/stage "$binary" LICENSE LICENSE-migration-firmware NOTICE
            tar -xzf "dist/$archive.tar.gz" -C dist/check
          fi
          ./dist/check/"$binary" --version
          "$PYTHON" scripts/check-embedded-packages.py crates/shelly2esphome/src/model.rs "dist/check/$binary"
      - uses: actions/upload-artifact@v7
        with:
          name: shelly2esphome-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The one required status check for main: green only if every job above
  # succeeded. A job skipped because a dependency failed would otherwise count
  # as passed if it were the required check itself.
  ci-passed:
    name: CI passed
    if: always()
    needs: [version, migration-firmware-host-tests, migration-firmware, cli, cli-msrv, cli-coverage, crate, cli-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success || { echo "a required job did not succeed"; exit 1; }
          done

  release:
    name: Release
    # Every push to main that passes CI is released as v<crate version>: a
    # GitHub release with the packages and CLI binaries, plus a crates.io
    # release with the packages inside the crate. The version
    # job has checked that the commit carries that version. Both steps skip
    # what already exists for this commit, so a failed release can simply be
    # re-run; a tag of this version on another commit fails the release.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.version.outputs.release != 'false'
    needs: [version, ci-passed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # No credentials in the checkout: cargo runs third-party build code.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/download-artifact@v8
        with:
          pattern: mg2esphome-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: shelly2esphome-*
          path: ${{ runner.temp }}/binaries
          merge-multiple: true
      - name: Bundle the packages
        run: |
          cp migration_firmware/LICENSE "$RUNNER_TEMP/packages/LICENSE"
          cd "$RUNNER_TEMP/packages" && zip -q ../mg2esphome-packages.zip mg2esphome-*.zip LICENSE
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release create reuses an existing tag and ignores --target, so a
          # tag of this version must point at this commit, release or not.
          # matching-refs answers an empty list for a missing tag, so every
          # failed request stops the job instead of reading as "no tag" (on an
          # HTTP error gh api prints the error body to stdout, ignoring --jq).
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" \
            --jq ".[] | select(.ref == \"refs/tags/v$VERSION\") | .ref")
          if [ -n "$ref" ]; then
            # The commits endpoint also resolves annotated tags to their commit.
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/v$VERSION" --jq .sha)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::tag v$VERSION points at $tagged, not at $GITHUB_SHA"
              exit 1
            fi
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "release v$VERSION exists already for this commit"
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            "$RUNNER_TEMP/mg2esphome-packages.zip" "$RUNNER_TEMP"/packages/mg2esphome-*.zip \
            "$RUNNER_TEMP"/binaries/shelly2esphome-*
      # Same packaging as the crate job (see there for --allow-dirty), which
      # already built and tested it from this commit and these packages, so
      # no third-party build code runs while the token is set.
      - name: Publish the crate on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'shelly2esphome-release (https://github.com/Nebensound/Shelly-for-ESPHome)' \
            "https://crates.io/api/v1/crates/shelly2esphome/$VERSION")
          if [ "$status" = 200 ]; then
            echo "shelly2esphome $VERSION is on crates.io already"
            exit 0
          fi
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "::error::the CARGO_REGISTRY_TOKEN secret is not set"; exit 1; }
          mkdir -p crates/shelly2esphome/packages
          cp "$RUNNER_TEMP"/packages/mg2esphome-*.zip crates/shelly2esphome/packages/
          git status --porcelain
          test -z "$(git status --porcelain)"
          cargo publish --locked --allow-dirty --no-verify -p shelly2esphome
