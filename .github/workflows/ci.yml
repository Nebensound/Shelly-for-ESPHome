name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Tests must not depend on a release download (crates/shelly2esphome/build.rs);
  # the macOS job embeds the packages of this run via SHELLY2ESPHOME_PACKAGES_DIR.
  SHELLY2ESPHOME_NO_DOWNLOAD: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-firmware-host-tests:
    name: Migration firmware – host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format gcovr
      - name: Formatting
        run: clang-format --dry-run --Werror migration_firmware/src/*.c migration_firmware/src/*.h migration_firmware/test/*.c
      - name: Tests with ASan/UBSan
        run: make -C migration_firmware/test check
      - name: Coverage (100% lines, branches, functions)
        run: make -C migration_firmware/test coverage

  migration-firmware:
    name: Migration firmware – ${{ matrix.model }}
    needs: migration-firmware-host-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model:
          - Shelly1
          - Shelly1PM
          - Shelly1L
          - Shelly2
          - Shelly25
          - ShellyPlugS
          - ShellyPlugUS
          - ShellyRGBW2
          - ShellyDimmer1
          - ShellyDimmer2
          - ShellyEM
          - ShellyBulb
          - ShellyVintage
          - ShellyDuo
          - ShellyDuoRGBW
          - ShellyI3
          - ShellyUni
    steps:
      - uses: actions/checkout@v4
      # mos and everything it fetches are pinned to the Mongoose OS release
      # 2.20.0 (see libs_version in migration_firmware/mos.yml): libraries and
      # modules from their fixed 2.20.0 tags, the prebuilt libraries from the
      # 2.20.0 release assets. Clones authenticate with the workflow token,
      # because GitHub may refuse anonymous clones (changelog 2026-10-19).
      - name: Install mos
        env:
          MOS_VERSION: 2.20.0
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mos" \
            "https://mongoose-os.com/downloads/mos-$MOS_VERSION/linux/mos"
          chmod +x "$RUNNER_TEMP/mos"
          "$RUNNER_TEMP/mos" version | tee "$RUNNER_TEMP/mos-version.txt"
          grep -q "$MOS_VERSION" "$RUNNER_TEMP/mos-version.txt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build with mos (local, Docker)
        working-directory: migration_firmware
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The token is passed as a file so it never shows up in the command line.
          umask 077
          printf 'github.com:%s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/mos-credentials"
          mos build --local --platform esp8266 --build-var MODEL=${{ matrix.model }} \
            --credentials "@$RUNNER_TEMP/mos-credentials"
      - name: Install PyYAML
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Verify package manifest
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, zipfile
          import yaml

          model = os.environ["MODEL"]
          conds = yaml.safe_load(open("migration_firmware/mos.yml"))["conds"]
          expected = next(
              c["apply"]["name"] for c in conds
              if c["when"] == f'build_vars.MODEL == "{model}"' and "name" in c["apply"]
          )
          with zipfile.ZipFile("migration_firmware/build/fw.zip") as package:
              name = next(n for n in package.namelist() if n.endswith("manifest.json"))
              manifest = json.loads(package.read(name))
          print(f"manifest name={manifest['name']} platform={manifest['platform']} expected={expected}")
          if manifest["name"] != expected or manifest["platform"] != "esp8266":
              sys.exit("manifest does not match the model")
          EOF
      - name: Rename package
        # The build container may leave fw.zip owned by root; copy instead of move.
        run: cp migration_firmware/build/fw.zip "mg2esphome-${{ matrix.model }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mg2esphome-${{ matrix.model }}
          path: mg2esphome-${{ matrix.model }}.zip
          if-no-files-found: error

  cli:
    name: CLI – checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Release build and smoke test outside the source tree
        run: |
          cargo build --release --locked
          cp target/release/shelly2esphome "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          ./shelly2esphome --version
          ./shelly2esphome --help

  cli-msrv:
    name: CLI – MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --all-targets --locked

  cli-coverage:
    name: CLI – coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage gate (100% regions, lines, functions of production code)
        # Unit tests live in src/unit_tests/ and are not production code.
        run: >-
          cargo llvm-cov --workspace --all-features --locked --show-missing-lines
          --ignore-filename-regex 'src/unit_tests/'
          --fail-under-regions 100 --fail-under-lines 100 --fail-under-functions 100

  cli-macos:
    name: CLI – macOS binary
    needs: [cli, migration-firmware]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # The release binary embeds the migration packages of all models, so
      # `flash` picks the right one itself (crates/shelly2esphome/build.rs).
      - uses: actions/download-artifact@v4
        with:
          pattern: mg2esphome-*
          path: packages
          merge-multiple: true
      - name: Check that every model has a package
        run: |
          expected=$(grep -c '^  *(Model::' crates/shelly2esphome/src/model.rs)
          found=$(ls packages/mg2esphome-*.zip | wc -l | tr -d ' ')
          echo "packages: $found of $expected"
          test "$found" -eq "$expected"
      - name: Build universal binary
        env:
          SHELLY2ESPHOME_PACKAGES_DIR: ${{ github.workspace }}/packages
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output shelly2esphome \
            target/aarch64-apple-darwin/release/shelly2esphome \
            target/x86_64-apple-darwin/release/shelly2esphome
          ./shelly2esphome --version
          # upload-artifact does not keep the executable bit; a tarball does.
          tar -czf shelly2esphome-macos-universal.tar.gz shelly2esphome
      - uses: actions/upload-artifact@v4
        with:
          name: shelly2esphome-macos-universal
          path: shelly2esphome-macos-universal.tar.gz
          if-no-files-found: error

  release:
    name: Release
    # Tag vX.Y.Z (= crate version): publishes the packages that
    # `cargo install` builds download, plus the macOS binary.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [migration-firmware-host-tests, migration-firmware, cli, cli-msrv, cli-coverage, cli-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/shelly2esphome/Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: mg2esphome-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: shelly2esphome-macos-universal
      - name: Bundle the packages
        run: cd packages && zip -q ../mg2esphome-packages.zip mg2esphome-*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            mg2esphome-packages.zip packages/mg2esphome-*.zip shelly2esphome-macos-universal.tar.gz
