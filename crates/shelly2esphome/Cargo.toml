[package]
name = "shelly2esphome"
version = "0.1.2"
description = "Flash a self-built ESPHome firmware onto Shelly Gen1 devices over the air"
# The CLI is MIT; the embedded migration firmware packages are GPL-3.0 (NOTICE).
license = "MIT AND GPL-3.0-only"
readme = "../../README.md"
keywords = ["shelly", "esphome", "esp8266", "ota", "firmware"]
categories = ["command-line-utilities", "embedded"]
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
# packages/ is filled by CI before packaging (build.rs, source 3); tests stay
# in the repository.
include = [
    "build.rs",
    "src/**/*.rs",
    "packages/mg2esphome-*.zip",
    "LICENSE",
    "LICENSE-migration-firmware",
    "NOTICE",
]

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zip.workspace = true

[build-dependencies]
zip.workspace = true

[lints]
workspace = true
