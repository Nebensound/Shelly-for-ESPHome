author: Nebensound (based on mgos-to-tasmota by mark dornbach <mark@dornbach.io>)
description: intermediate firmware that installs a user-built ESPHome image from Shelly Gen1 stock firmware, driven by the shelly2esphome CLI
platform: esp8266
version: 0.5.0

libs_version: ${mos.version}
modules_version: ${mos.version}
mongoose_os_version: ${mos.version}
manifest_version: 2020-01-29
sources: [src]
filesystem: [fs]
tags: [c, esphome, shelly, mongoose]

# The Wi-Fi credentials are taken over from the stock firmware's user
# configuration (conf9.json). conf_acl limits what that file may override, so
# stock settings such as HTTP authentication, a disabled RPC endpoint or a
# changed HTTP port can never make this firmware unreachable.
config_schema:
  - ["conf_acl", "wifi.sta.*,device.*"]
  - ["http.enable", true]
  - ["http.listen_addr", "80"]
  # No static file serving: the filesystem holds conf9.json with the Wi-Fi
  # credentials. Only /rpc and the /update recovery endpoint are needed.
  - ["http.document_root", ""]
  - ["rpc.enable", true]
  - ["rpc.http_enable", true]
  - ["debug.level", 2] # 0 = ERROR, 1 = WARN, 2 = INFO, 3+ = DEBUG
  - ["wifi.ap.enable", false]
  - ["wifi.sta.enable", true] # join wifi as client
  - ["sta_connect_timeout", 30] # timeout for wifi connection / seconds
  - ["wifi.sta1.ssid", "mgos-recover"] # fallback SSID
  - ["wifi.sta1.pass", "RJoPuKC3u5"] # fallback password

libs:
  - origin: https://github.com/mongoose-os-libs/boards # board definitions
  - origin: https://github.com/mongoose-os-libs/http-server # serves /rpc and /update
  - origin: https://github.com/mongoose-os-libs/rpc-common # RPC over HTTP (MG2X.*, Sys.GetInfo)
  - origin: https://github.com/mongoose-os-libs/ota-common # OTA support
  - origin: https://github.com/mongoose-os-libs/ota-http-server # recovery: POST /update with a stock firmware ZIP

conds:
  # The dimmers talk to their STM32 co-processor over UART0; keep it silent.
  - when: build_vars.MODEL == "ShellyDimmer1"
    apply:
      config_schema:
        - ["debug.stdout_uart", -1]
        - ["debug.stderr_uart", -1]
  - when: build_vars.MODEL == "ShellyDimmer2"
    apply:
      config_schema:
        - ["debug.stdout_uart", -1]
        - ["debug.stderr_uart", -1]
  - when: build_vars.MODEL == "Shelly1"
    apply:
      name: switch1
      build_vars:
        FS_SIZE: 262144
        FLASH_SIZE: 2097152
        BOOT_CONFIG_ADDR: 0x1000
        MGOS_ROOT_FS_TYPE: SPIFFS
  - when: build_vars.MODEL == "Shelly1PM"
